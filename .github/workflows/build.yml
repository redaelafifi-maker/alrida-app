name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          html = Path("www/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>', html, re.I)
          checked = 0
          for attrs, code in blocks:
              kind = re.search(r'type=["\\']([^"\\']+)["\\']', attrs, re.I)
              if kind and kind.group(1).lower() not in ("text/javascript", "application/javascript", "module"):
                  continue
              result = subprocess.run(["node", "--check", "-"], input=code, text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr)
                  print("Inline script syntax error in block", checked + 1)
                  sys.exit(result.returncode)
              checked += 1
          print(f"Validated {checked} inline JavaScript blocks.")
          PY
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlRida-Shop-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
